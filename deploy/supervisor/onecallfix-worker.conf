; 1CallFix — persistent queue worker (Supervisor config)
;
; Production-hardening session, Part 3. Referenced by PROJECT_HANDOFF.md §9
; ("Queue worker: onecallfix-worker, managed by Supervisor") and
; docs/DEPLOYMENT_RUNBOOK.md, but the actual config text lived only on the
; production server, undocumented and unversioned, until this file. This is
; now the single source of truth for that worker's configuration — if the
; live server's copy ever drifts from this file, THIS file wins; update the
; server to match it, not the other way around.
;
; CONFIRMED PATH (2026-08-31 deploy): this CyberPanel server keeps program
; configs at /etc/supervisord.d/*.ini — NOT the Debian-standard
; /etc/supervisor/conf.d/*.conf. This file installs to
; /etc/supervisord.d/onecallfix-worker.ini. Drift observed on that live copy
; at the same time: its command= was missing the explicit `database`
; connection arg and `--timeout=120`. See docs/DEPLOYMENT_RUNBOOK.md §4.
;
; Install (first time, or after editing this file) — run as root:
;   cp /home/1callfix.com/public_html/deploy/supervisor/onecallfix-worker.conf /etc/supervisord.d/onecallfix-worker.ini
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start onecallfix-worker:*
;
; TWO WORKERS, ONE GROUP (2026-10-25). Job offers (every dispatch round and the
; offer push, see app/Support/DispatchQueue.php) get their own `dispatch`
; queue and their own worker, so a backup, an email batch or a slow SMTP send
; can never make an offer wait. The group keeps the name onecallfix-worker, so
; `supervisorctl restart onecallfix-worker:*` still restarts both.
;   onecallfix-default  -- the connection's own queue, command unchanged from
;                          the single worker this replaces
;   onecallfix-dispatch -- dispatch only, polls every second
; Keep onecallfix-dispatch at numprocs=1 and do not add `dispatch` to the
; default worker: candidate selection and offer creation in the dispatch jobs
; run outside the booking lock and rely on rounds running one at a time,
; exactly as they did on the single worker. Parallel dispatch workers need
; that locked first.
; Switch order: install this file and start both workers FIRST, check
; `supervisorctl status`, THEN set DISPATCH_QUEUE=dispatch in .env and run
; config:cache + restart onecallfix-worker:*. Reverse to roll back: remove
; DISPATCH_QUEUE, config:cache, restart, then (optionally) the old file.
;
; After a normal code deploy (no config change), just restart the workers
; so they pick up the new code (queue workers cache the booted application
; in memory and do NOT see a `git pull`/file change until restarted):
;   supervisorctl restart onecallfix-worker:*

[group:onecallfix-worker]
programs=onecallfix-default,onecallfix-dispatch

[program:onecallfix-default]
; QUEUE_CONNECTION defaults to 'database' (see .env.example) — matches
; config/queue.php's 'database' connection, retry_after=90s default.
; --sleep=3: poll interval when the queue is empty, a reasonable default,
;   not a business decision.
; --tries=3: matches this codebase's own convention elsewhere (dispatch
;   jobs already handle their own retry/backoff internally where it
;   matters, e.g. ServiceMatchingJob's self-requeue) — a bare job that
;   fails 3 times lands in failed_jobs for manual review, never silently
;   dropped.
; --max-time=3600: recycle the worker process hourly (guards against slow
;   PHP memory growth over a long-running process) — Supervisor's
;   autorestart=true immediately starts a fresh one.
command=php /home/1callfix.com/public_html/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
process_name=%(program_name)s_%(process_num)02d
directory=/home/1callfix.com/public_html
user=callf1207
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/1callfix.com/public_html/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:onecallfix-dispatch]
; Offers only, ONE process (see the note at the top). --sleep=1: an empty-queue poll every second, so a new offer is
; picked up within about a second. Same tries/recycle/timeout as above.
command=php /home/1callfix.com/public_html/artisan queue:work database --queue=dispatch --sleep=1 --tries=3 --max-time=3600 --timeout=120
process_name=%(program_name)s_%(process_num)02d
directory=/home/1callfix.com/public_html
user=callf1207
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/1callfix.com/public_html/storage/logs/worker-dispatch.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
