<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="1CallFix">
  <!--
    App icon. Deliberately a typographic monogram rather than invented logo
    artwork: no brand mark exists anywhere in this repository (public/ ships
    an empty favicon.ico and nothing else), and drawing one here would be
    fabricating brand identity rather than using it. The wordmark colour
    matches the slate-900 theme-color the customer layout declares.

    SVG rather than raster PNGs for the same reason — no source artwork
    exists to render from. Chrome accepts an SVG icon with sizes="any" for
    installability.
  -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <text x="256" y="256" fill="#ffffff"
        font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="248" font-weight="700" letter-spacing="-8"
        text-anchor="middle" dominant-baseline="central">1CF</text>
</svg>
