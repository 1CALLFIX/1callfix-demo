<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="1CallFix">
  <!--
    Maskable variant of icons/icon.svg. Same monogram, but the artwork is
    kept inside the safe zone (the middle 80% — a 409px circle) and the
    background bleeds to every edge, so an OS that crops this to a circle,
    squircle or rounded square never clips the mark. That is the entire
    difference between purpose="any" and purpose="maskable"; shipping one
    file for both is how icons end up with their corners shaved off on
    Android.
  -->
  <rect width="512" height="512" fill="#0f172a"/>
  <text x="256" y="256" fill="#ffffff"
        font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="188" font-weight="700" letter-spacing="-6"
        text-anchor="middle" dominant-baseline="central">1CF</text>
</svg>
