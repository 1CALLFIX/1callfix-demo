apply plugin: 'com.android.application'

android {
    namespace = "com.onecallfix.shell"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }

    // One project, three Play Store apps. The package names are the live Play apps' (old Glover apps), so these
    // builds are updates to them. versionCode must be higher than the one live in Play Console: pass
    // -PcustomerVersionCode=… (or rider/partner) on the build PC when Play Console shows a higher number.
    flavorDimensions = ["app"]
    productFlavors {
        customer {
            dimension "app"
            applicationId "com.call.customer"
            versionCode((project.findProperty("customerVersionCode") ?: "93") as int)
            versionName "2.0.0"
        }
        rider {
            dimension "app"
            applicationId "com.onecall.deliveryboy"
            versionCode((project.findProperty("riderVersionCode") ?: "87") as int)
            versionName "2.0.0"
        }
        partner {
            dimension "app"
            applicationId "com.onecall.vendor"
            versionCode((project.findProperty("partnerVersionCode") ?: "83") as int)
            versionName "2.0.0"
        }
    }

    // Each live app was signed with its own key. android/key-<flavor>.properties (NEVER in git) holds
    // storeFile, storePassword, keyAlias, keyPassword for that app — see mobile/README.md.
    signingConfigs {
        ["customer", "rider", "partner"].each { name ->
            def f = rootProject.file("key-${name}.properties")
            if (f.exists()) {
                def props = new Properties()
                f.withInputStream { props.load(it) }
                create(name) {
                    storeFile file(props["storeFile"])
                    storePassword props["storePassword"]
                    keyAlias props["keyAlias"]
                    keyPassword props["keyPassword"]
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Sign each release flavor with its own key, when the key file is on this machine.
android.productFlavors.all { flavor ->
    def cfg = android.signingConfigs.findByName(flavor.name)
    if (cfg != null) {
        flavor.signingConfig = cfg
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Same version the push plugin uses; the app's own PushService extends the plugin's service.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
