<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>No internet</title></head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:16px">
<div>
  <h1 style="font-size:20px;margin:0 0 8px">No internet connection</h1>
  <p style="margin:0 0 20px;color:#475569">Check your mobile data or Wi-Fi, then try again.</p>
  <button onclick="history.length > 1 ? history.back() : location.reload()" style="min-height:48px;padding:0 24px;border:0;border-radius:12px;background:#2563EB;color:#fff;font-size:16px;font-weight:600">Try again</button>
</div></body></html>
